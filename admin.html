<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sekelo — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C1018;--surface:#131A24;--surface-2:#1A2330;--border:#1E2C3C;--border-2:#253545;--accent:#C8A55A;--up:#E05555;--down:#3DAA6E;--text:#E8E2D5;--text-2:#9A9080;--text-3:#5A5245;--text-4:#3A342C;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace;}
*{margin:0;padding:0;box-sizing:border-box;}html{font-size:14px;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;min-height:100vh;-webkit-font-smoothing:antialiased;}

.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;}
.gate-card{background:var(--surface);border:1px solid var(--border);padding:48px 40px;width:380px;}
.gate-logo{font-family:var(--serif);font-size:30px;font-weight:600;margin-bottom:4px;}
.gate-sub{font-family:var(--sans);font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:2.5px;color:var(--text-3);margin-bottom:36px;}
.gate-inp{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:14px;padding:13px 16px;outline:none;margin-bottom:12px;transition:border .2s;}
.gate-inp:focus{border-color:var(--accent);}
.gate-btn{width:100%;background:var(--accent);border:none;color:#0C1018;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:14px;cursor:pointer;transition:opacity .2s;}
.gate-btn:hover{opacity:.85;}
.gate-err{font-family:var(--mono);font-size:10px;color:var(--up);margin-top:10px;min-height:16px;}

.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;}
.logo-wrap{display:flex;align-items:baseline;gap:10px;text-decoration:none;}
.logo{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--text);}
.logo-rule{width:1px;height:12px;background:var(--border-2);align-self:center;}
.logo-sub{font-family:var(--sans);font-size:9px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:1.5px;}
.nav-link{font-family:var(--sans);font-size:9px;color:var(--text-3);text-decoration:none;padding:5px 10px;border:1px solid transparent;transition:all .2s;text-transform:uppercase;letter-spacing:.5px;}
.nav-link:hover{color:var(--accent);border-color:var(--border);}
.hdr-right{display:flex;gap:8px;}

.subhdr{background:var(--surface-2);border-bottom:1px solid var(--border);padding:7px 32px;display:flex;align-items:center;justify-content:space-between;}
.sub-l{font-family:var(--serif);font-size:12px;font-style:italic;color:var(--text-3);}
.sub-r{font-family:var(--mono);font-size:9px;color:var(--text-4);}

.btabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);padding:0 32px;overflow-x:auto;}
.btab{padding:11px 18px;font-family:var(--sans);font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;white-space:nowrap;flex-shrink:0;}
.btab:hover{color:var(--text-2);}
.btab.active{color:var(--accent);border-bottom-color:var(--accent);}
.bsrc{font-family:var(--mono);font-size:8px;opacity:.6;margin-left:5px;}

.main{max-width:1140px;padding:20px 32px 90px;}

.loading{padding:60px;text-align:center;}
.ldots{display:inline-flex;gap:5px;margin-bottom:10px;}
.ldots span{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite;}
.ldots span:nth-child(2){animation-delay:.2s;}.ldots span:nth-child(3){animation-delay:.4s;}
.ltext{font-family:var(--mono);font-size:10px;color:var(--text-4);}

.catsec{margin-bottom:8px;background:var(--surface);border:1px solid var(--border);}
.cathdr{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:background .15s;}
.cathdr:hover{background:var(--surface-2);}
.cat-l{display:flex;align-items:center;gap:12px;}
.catname{font-family:var(--sans);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);}
.catpill{font-family:var(--mono);font-size:8px;color:var(--text-3);padding:2px 7px;border:1px solid var(--border-2);}
.catpill.full{color:var(--down);border-color:rgba(61,170,110,.3);}
.cattog{font-family:var(--mono);font-size:12px;color:var(--text-3);width:20px;text-align:center;}
.catbody{border-top:1px solid var(--border);}
.catbody.collapsed{display:none;}

.ptable{width:100%;border-collapse:collapse;}
.ptable th{font-family:var(--sans);font-size:8px;font-weight:500;text-transform:uppercase;letter-spacing:1px;color:var(--text-3);padding:8px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
.ptable th.r{text-align:right;}.ptable th.c{text-align:center;}
.ptable td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
.ptable tr:last-child td{border-bottom:none;}
.ptable tr.unavail td{opacity:.35;}

.pname{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--text);}
.plast{font-family:var(--mono);font-size:9px;color:var(--text-3);margin-top:3px;}
.plast.known{color:var(--text-2);}
.upill{display:inline-block;font-family:var(--mono);font-size:8px;color:var(--text-3);border:1px solid var(--border-2);padding:2px 8px;white-space:nowrap;}

.pinp{background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:13px;padding:8px 12px;outline:none;transition:border .2s;width:130px;text-align:right;}
.pinp:focus{border-color:var(--accent);}
.pinp.entered{border-color:var(--border-2);color:var(--accent);}
.pinp:disabled{opacity:.3;cursor:not-allowed;}

.ndisp{font-family:var(--mono);font-size:10px;color:var(--text-3);text-align:right;white-space:nowrap;min-width:100px;}
.ndisp.live{color:var(--text-2);}

.achk{width:15px;height:15px;cursor:pointer;accent-color:var(--accent);}

.ninp{background:transparent;border:1px solid transparent;color:var(--text-2);font-family:var(--sans);font-size:11px;font-weight:300;padding:7px 10px;outline:none;transition:border .2s;width:100%;min-width:160px;}
.ninp:focus{border-color:var(--border-2);background:var(--surface-2);}
.ninp::placeholder{color:var(--text-3);}

.sbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 32px;display:flex;align-items:center;justify-content:space-between;z-index:50;}
.sinfo{font-family:var(--mono);font-size:10px;color:var(--text-3);}
.sinfo b{color:var(--text-2);font-weight:500;}
.sbtn{background:var(--accent);border:none;color:#0C1018;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:12px 32px;cursor:pointer;transition:opacity .2s;}
.sbtn:hover{opacity:.85;}
.sbtn:disabled{opacity:.3;cursor:not-allowed;}

.toast{position:fixed;top:20px;right:20px;background:var(--surface);border:1px solid var(--border);padding:12px 18px;font-family:var(--mono);font-size:10px;color:var(--text);z-index:9999;opacity:0;transform:translateY(-6px);transition:all .3s;pointer-events:none;max-width:320px;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.ok{border-color:var(--down);color:var(--down);}
.toast.err{border-color:var(--up);color:var(--up);}

@keyframes blink{0%,80%,100%{opacity:.15}40%{opacity:1}}
::-webkit-scrollbar{width:3px;height:3px;}::-webkit-scrollbar-thumb{background:var(--border-2);}
@media(max-width:768px){.header,.subhdr,.main,.sbar{padding-left:16px;padding-right:16px;}.btabs{padding:0 16px;}.ninp{display:none;}.pinp{width:100px;}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-logo">Sekelo</div>
    <div class="gate-sub">Price Administration</div>
    <input type="password" class="gate-inp" id="passInput" placeholder="Password" onkeydown="if(event.key==='Enter')auth()">
    <button class="gate-btn" onclick="auth()">Enter</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<div id="app" style="display:none">
  <header class="header">
    <a href="index.html" class="logo-wrap">
      <div class="logo">Sekelo</div><div class="logo-rule"></div>
      <div class="logo-sub">Admin</div>
    </a>
    <div class="hdr-right">
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="boq.html" class="nav-link">BoQ</a>
    </div>
  </header>

  <div class="subhdr">
    <div class="sub-l">Price Entry — <span id="branchLabel">—</span></div>
    <div class="sub-r" id="sessionDate">—</div>
  </div>

  <div class="btabs" id="branchTabs"></div>

  <main class="main">
    <div class="loading" id="loadState">
      <div class="ldots"><span></span><span></span><span></span></div>
      <div class="ltext">Loading products</div>
    </div>
    <div id="formContent" style="display:none"></div>
  </main>
</div>

<div class="sbar" id="sbar" style="display:none">
  <div class="sinfo"><b id="entryCount">0</b> prices entered &nbsp;·&nbsp; <b id="branchName">—</b></div>
  <button class="sbtn" id="submitBtn" onclick="submitBranch()">Submit Prices</button>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://glvpdeneagsqwxzrtaln.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdsdnBkZW5lYWdzcXd4enJ0YWxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzODQ4NDQsImV4cCI6MjA4Nzk2MDg0NH0.y5gJY1XRFj5uGYUjnkZ9rPfLQRdub5uKBn8jIxEpdP8';
const PASS   = 'sekelo2026';
const BORDER = 0.20;

const BRANCHES = [
  {key:'Southgate | Cashbuild',             city:'Joburg',    label:'Southgate',       source:'Cashbuild'},
  {key:'Nelspruit Plaza | Cashbuild',       city:'Nelspruit', label:'Nelspruit Plaza', source:'Cashbuild'},
  {key:'Johannesburg | Builders Warehouse', city:'Joburg',    label:'Johannesburg',    source:'Builders Warehouse'},
  {key:'Mbombela | Builders Warehouse',     city:'Mbombela',  label:'Mbombela',        source:'Builders Warehouse'},
];

let categories=[], products=[], lastPrices={}, entries={}, activeBranch=BRANCHES[0].key, collapsedCats=new Set(), busy=false;
BRANCHES.forEach(b=>entries[b.key]={});

function auth(){
  const v=document.getElementById('passInput').value;
  if(v===PASS){
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('sbar').style.display='flex';
    document.getElementById('sessionDate').textContent=new Date().toLocaleDateString('en-ZA',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
    init();
  }else{
    document.getElementById('gateErr').textContent='Incorrect password.';
    document.getElementById('passInput').value='';
    document.getElementById('passInput').focus();
  }
}

async function get(path){
  const r=await fetch(`${SB_URL}/rest/v1/${path}`,{headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`}});
  if(!r.ok) throw new Error(`${r.status} ${path}`);
  return r.json();
}
async function post(path,data){
  return fetch(`${SB_URL}/rest/v1/${path}`,{
    method:'POST',
    headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify(data)
  });
}

async function init(){
  try{
    [categories,products]=await Promise.all([
      get('categories?select=*&order=display_order&active=eq.true'),
      get('products?select=*&order=display_order&active=eq.true'),
    ]);
    const recent=await get('prices?select=product_id,branch,price_zar,normalized_price,timestamp&order=timestamp.desc&limit=2000&product_id=not.is.null');
    recent.forEach(p=>{
      if(!p.product_id)return;
      if(!lastPrices[p.product_id])lastPrices[p.product_id]={};
      if(!lastPrices[p.product_id][p.branch])lastPrices[p.product_id][p.branch]={price_zar:p.price_zar,normalized_price:p.normalized_price,timestamp:p.timestamp};
    });
    renderTabs();
    renderBranch(activeBranch);
    document.getElementById('loadState').style.display='none';
    document.getElementById('formContent').style.display='block';
  }catch(e){
    document.getElementById('loadState').innerHTML=`<div style="color:var(--up);font-family:var(--mono);font-size:11px;line-height:1.8">Error: ${e.message}<br>Run sekelo_schema.sql in Supabase first, then enable anon SELECT on categories and products tables.</div>`;
    console.error(e);
  }
}

function renderTabs(){
  document.getElementById('branchTabs').innerHTML=BRANCHES.map(b=>
    `<div class="btab ${b.key===activeBranch?'active':''}" onclick="switchBranch(${JSON.stringify(b.key)})">${b.label}<span class="bsrc">${b.source}</span></div>`
  ).join('');
}

function switchBranch(key){activeBranch=key;renderTabs();renderBranch(key);}

function renderBranch(bk){
  const b=BRANCHES.find(x=>x.key===bk);
  document.getElementById('branchLabel').textContent=`${b.label} — ${b.source}`;
  document.getElementById('branchName').textContent=b.label;

  const bycat={};
  products.forEach(p=>{if(!bycat[p.category_id])bycat[p.category_id]=[];bycat[p.category_id].push(p);});

  document.getElementById('formContent').innerHTML=categories.map(cat=>{
    const prods=bycat[cat.id]||[];
    if(!prods.length)return'';
    const entered=prods.filter(p=>entries[bk][p.id]?.price_zar).length;
    const ck=`${bk}||${cat.id}`;
    const col=collapsedCats.has(ck);

    const rows=prods.map(p=>{
      const e=entries[bk][p.id]||{};
      const lp=lastPrices[p.id]?.[bk];
      const hasV=!!e.price_zar;
      const avail=e.available!==false;
      const lastTxt=lp?`R ${parseFloat(lp.price_zar).toFixed(2)} · ${ago(lp.timestamp)}`:'No previous data';
      const hasN=p.normalized_divisor>1;
      const normTxt=hasV&&hasN?`R ${(parseFloat(e.price_zar)/p.normalized_divisor).toFixed(2)} / ${p.normalized_unit}`:'—';
      return`<tr id="row_${p.id}" class="${!avail?'unavail':''}">
        <td><div class="pname">${esc(p.product_name)}</div><div class="plast ${lp?'known':''}">${lastTxt}</div></td>
        <td><span class="upill">${esc(p.unit)}</span></td>
        <td style="text-align:right"><input type="number" step="0.01" min="0" class="pinp ${hasV?'entered':''}" id="pi_${p.id}" placeholder="R 0.00" value="${e.price_zar||''}" ${!avail?'disabled':''} oninput="setPrice(${p.id},this.value)"></td>
        <td><div class="ndisp ${hasV&&hasN?'live':''}" id="nd_${p.id}">${normTxt}</div></td>
        <td style="text-align:center"><input type="checkbox" class="achk" id="av_${p.id}" ${avail?'checked':''} onchange="setAvail(${p.id},this.checked)"></td>
        <td><input type="text" class="ninp" id="nt_${p.id}" placeholder="Optional note…" value="${esc(e.row_notes||'')}" oninput="setNotes(${p.id},this.value)"></td>
      </tr>`;
    }).join('');

    return`<div class="catsec">
      <div class="cathdr" onclick="toggleCat(${JSON.stringify(ck)})">
        <div class="cat-l">
          <div class="catname">${esc(cat.name)}</div>
          <div class="catpill ${entered===prods.length&&entered>0?'full':''}">${entered}/${prods.length}</div>
        </div>
        <div class="cattog" id="ct_${cat.id}">${col?'+':'−'}</div>
      </div>
      <div class="catbody ${col?'collapsed':''}" id="cb_${cat.id}">
        <table class="ptable">
          <thead><tr>
            <th style="min-width:220px">Product</th>
            <th style="min-width:110px">Unit</th>
            <th class="r" style="min-width:145px">Price (ZAR)</th>
            <th class="r" style="min-width:120px">R / Unit</th>
            <th class="c" style="min-width:80px">Available</th>
            <th style="min-width:170px">Notes</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');
  updateBar();
}

function setPrice(pid,val){
  if(!entries[activeBranch][pid])entries[activeBranch][pid]={available:true};
  entries[activeBranch][pid].price_zar=val;
  const el=document.getElementById(`pi_${pid}`);
  if(el)el.classList.toggle('entered',!!val);
  const prod=products.find(p=>p.id===pid);
  const nd=document.getElementById(`nd_${pid}`);
  if(nd&&prod){
    const n=parseFloat(val);
    if(val&&!isNaN(n)&&prod.normalized_divisor>1){nd.textContent=`R ${(n/prod.normalized_divisor).toFixed(2)} / ${prod.normalized_unit}`;nd.classList.add('live');}
    else{nd.textContent='—';nd.classList.remove('live');}
  }
  updateBar();
}

function setAvail(pid,checked){
  if(!entries[activeBranch][pid])entries[activeBranch][pid]={};
  entries[activeBranch][pid].available=checked;
  const row=document.getElementById(`row_${pid}`);
  const inp=document.getElementById(`pi_${pid}`);
  if(row)row.classList.toggle('unavail',!checked);
  if(inp){inp.disabled=!checked;if(!checked){inp.value='';setPrice(pid,'');}}
}

function setNotes(pid,val){
  if(!entries[activeBranch][pid])entries[activeBranch][pid]={};
  entries[activeBranch][pid].row_notes=val;
}

function toggleCat(ck){
  const catId=ck.split('||')[1];
  const body=document.getElementById(`cb_${catId}`);
  const icon=document.getElementById(`ct_${catId}`);
  if(collapsedCats.has(ck)){collapsedCats.delete(ck);if(body)body.classList.remove('collapsed');if(icon)icon.textContent='−';}
  else{collapsedCats.add(ck);if(body)body.classList.add('collapsed');if(icon)icon.textContent='+';}
}

async function submitBranch(){
  if(busy)return;
  const b=BRANCHES.find(x=>x.key===activeBranch);
  const now=new Date().toISOString();
  const rows=[];

  for(const[pidStr,entry]of Object.entries(entries[activeBranch])){
    const pid=parseInt(pidStr);
    const prod=products.find(p=>p.id===pid);
    if(!prod)continue;
    const pz=parseFloat(entry.price_zar);
    const hasP=!isNaN(pz)&&pz>0;
    const isU=entry.available===false;
    if(!hasP&&!isU)continue;
    const fp=hasP?pz:0;
    const np=hasP&&prod.normalized_divisor>1?parseFloat((fp/prod.normalized_divisor).toFixed(4)):null;
    rows.push({
      product_id:pid,category_id:prod.category_id,
      material_id:`c${prod.category_id}_p${pid}`,
      material:prod.product_name,
      branch:activeBranch,city:b.city,source:b.source,
      price_zar:fp,price_szl:parseFloat((fp*(1+BORDER)).toFixed(2)),
      normalized_price:np,available:!isU,
      row_notes:entry.row_notes||null,timestamp:now,
    });
  }

  if(!rows.length){toast('No prices to submit.','err');return;}
  busy=true;
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='Submitting…';

  try{
    const res=await post('prices',rows);
    if(res.ok){
      rows.forEach(r=>{
        if(!lastPrices[r.product_id])lastPrices[r.product_id]={};
        lastPrices[r.product_id][activeBranch]={price_zar:r.price_zar,normalized_price:r.normalized_price,timestamp:r.timestamp};
      });
      toast(`✓ ${rows.length} price${rows.length!==1?'s':''} saved for ${b.label}`,'ok');
      entries[activeBranch]={};
      renderBranch(activeBranch);
    }else{
      toast('Submit failed — see console.','err');
      console.error(await res.text());
    }
  }catch(e){toast('Network error.','err');console.error(e);}
  finally{busy=false;btn.disabled=false;btn.textContent='Submit Prices';}
}

function updateBar(){
  document.getElementById('entryCount').textContent=Object.values(entries[activeBranch]).filter(e=>e.price_zar).length;
}

function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className=`toast show ${type}`;
  setTimeout(()=>el.classList.remove('show'),4000);
}

function ago(ts){
  if(!ts)return'';
  const d=Math.floor((Date.now()-new Date(ts).getTime())/86400000);
  if(d===0)return'today';if(d===1)return'yesterday';
  if(d<7)return`${d}d ago`;if(d<30)return`${Math.floor(d/7)}w ago`;
  return`${Math.floor(d/30)}mo ago`;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
</body>
</html>
